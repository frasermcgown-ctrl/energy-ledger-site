backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Website Text"
    files:
      - name: "content"
        label: "Page Text"
        file: "content/site-content.json"
        fields:
          - { label: "Hero — eyebrow line", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero — title line 1", name: "hero_title_line1", widget: "string" }
          - { label: "Hero — title line 2", name: "hero_title_line2", widget: "string" }
          - { label: "Hero — title line 3", name: "hero_title_line3", widget: "string" }
          - { label: "Hero — subheading", name: "hero_subhead", widget: "text" }
          - { label: "Hero — byline (HTML allowed)", name: "hero_byline", widget: "string" }


          - { label: "Coverage — section tag", name: "coverage_tag", widget: "string" }
          - { label: "Coverage — section title", name: "coverage_title", widget: "string" }
          - { label: "Coverage — section description", name: "coverage_desc", widget: "text" }
          - { label: "Coverage 1 — code", name: "coverage_1_code", widget: "string" }
          - { label: "Coverage 1 — title", name: "coverage_1_title", widget: "string" }
          - { label: "Coverage 1 — description", name: "coverage_1_desc", widget: "text" }
          - { label: "Coverage 2 — code", name: "coverage_2_code", widget: "string" }
          - { label: "Coverage 2 — title", name: "coverage_2_title", widget: "string" }
          - { label: "Coverage 2 — description", name: "coverage_2_desc", widget: "text" }
          - { label: "Coverage 3 — code", name: "coverage_3_code", widget: "string" }
          - { label: "Coverage 3 — title", name: "coverage_3_title", widget: "string" }
          - { label: "Coverage 3 — description", name: "coverage_3_desc", widget: "text" }
          - { label: "Coverage 4 — code", name: "coverage_4_code", widget: "string" }
          - { label: "Coverage 4 — title", name: "coverage_4_title", widget: "string" }
          - { label: "Coverage 4 — description", name: "coverage_4_desc", widget: "text" }

          - { label: "Readership — section tag", name: "who_tag", widget: "string" }
          - { label: "Readership — section title", name: "who_title", widget: "string" }
          - { label: "Readership — section description", name: "who_desc", widget: "text" }
          - { label: "Readership 1 — role", name: "who_1_role", widget: "string" }
          - { label: "Readership 1 — description", name: "who_1_desc", widget: "text" }
          - { label: "Readership 2 — role", name: "who_2_role", widget: "string" }
          - { label: "Readership 2 — description", name: "who_2_desc", widget: "text" }
          - { label: "Readership 3 — role", name: "who_3_role", widget: "string" }
          - { label: "Readership 3 — description", name: "who_3_desc", widget: "text" }
          - { label: "Readership 4 — role", name: "who_4_role", widget: "string" }
          - { label: "Readership 4 — description", name: "who_4_desc", widget: "text" }

          - { label: "Latest Issues — section description", name: "issue_desc", widget: "text" }
          - { label: "Latest Issues — card label", name: "issue_meta", widget: "string" }
          - { label: "Latest Issues — card title", name: "issue_card_title", widget: "string" }
          - { label: "Latest Issues — card description", name: "issue_card_desc", widget: "text" }

          - { label: "About — pull quote", name: "about_quote", widget: "text" }
          - { label: "About — heading", name: "about_heading", widget: "string" }
          - { label: "About — paragraph 1", name: "about_p1", widget: "text" }
          - { label: "About — paragraph 2", name: "about_p2", widget: "text" }

          - { label: "Footer — heading", name: "footer_title", widget: "string" }
          - { label: "Footer — subtext", name: "footer_sub", widget: "text" }
          - { label: "Footer — tagline", name: "footer_tagline", widget: "string" }
          - { label: "Footer — copyright line", name: "footer_copyright", widget: "string" }

          - { label: "Social — LinkedIn link", name: "social_linkedin", widget: "string", required: false, hint: "Full link, e.g. https://www.linkedin.com/company/…. Leave blank to hide the icon." }
          - { label: "Social — X link", name: "social_x", widget: "string", required: false, hint: "Full link, e.g. https://x.com/…. Leave blank to hide the icon." }
          - { label: "Social — Bluesky link", name: "social_bluesky", widget: "string", required: false, hint: "Full link, e.g. https://bsky.app/profile/…. Leave blank to hide the icon." }
          - { label: "Social — Threads link", name: "social_threads", widget: "string", required: false, hint: "Full link, e.g. https://www.threads.com/@…. Leave blank to hide the icon." }
          - { label: "Social — Instagram link", name: "social_instagram", widget: "string", required: false, hint: "Full link, e.g. https://www.instagram.com/…. Leave blank to hide the icon." }
          - { label: "Social — Facebook link", name: "social_facebook", widget: "string", required: false, hint: "Full link, e.g. https://www.facebook.com/…. Leave blank to hide the icon." }
          - { label: "Social — TikTok link", name: "social_tiktok", widget: "string", required: false, hint: "Full link, e.g. https://www.tiktok.com/@…. Leave blank to hide the icon." }
          - { label: "Social — YouTube link", name: "social_youtube", widget: "string", required: false, hint: "Full link, e.g. https://www.youtube.com/@…. Leave blank to hide the icon." }
          - { label: "Social — Substack link", name: "social_substack", widget: "string", required: false, hint: "Full link, e.g. https://home.theenergyledger.co.uk. Leave blank to hide the icon." }

  - name: "pricecap"
    label: "Ofgem Price Cap"
    files:
      - name: "price-cap"
        label: "Price cap (Prices page)"
        file: "content/price-cap.json"
        fields:
          - label: "Current cap"
            name: "current"
            widget: "object"
            fields:
              - { label: "Period", name: "period", widget: "string", hint: "e.g. 1 Jan – 31 Mar 2027" }
              - { label: "Electricity unit rate (p/kWh)", name: "elec_unit_p_kwh", widget: "number", value_type: "float" }
              - { label: "Electricity standing charge (p/day)", name: "elec_standing_p_day", widget: "number", value_type: "float" }
              - { label: "Gas unit rate (p/kWh)", name: "gas_unit_p_kwh", widget: "number", value_type: "float" }
              - { label: "Gas standing charge (p/day)", name: "gas_standing_p_day", widget: "number", value_type: "float" }
              - { label: "Change vs previous cap (%)", name: "change_pct", widget: "number", value_type: "float", required: false }
              - { label: "Typical annual dual fuel bill (£)", name: "typical_annual_gbp", widget: "string", required: false, hint: "Optional. Leave blank to hide." }
              - { label: "Ofgem announcement link", name: "source_url", widget: "string" }
          - { label: "Next announcement date", name: "next_announcement", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - { label: "Next cap period", name: "next_period", widget: "string" }

  - name: "carbon"
    label: "UK Carbon Auctions"
    files:
      - name: "uka-auctions"
        label: "UKA auction calendar (Prices page)"
        file: "content/uka-auctions.json"
        fields:
          - { label: "Note", name: "note", widget: "text" }
          - { label: "Auction reserve price now (£ per allowance)", name: "reserve_price_gbp", widget: "number", value_type: "float" }
          - { label: "Next reserve price (£)", name: "reserve_price_next_gbp", widget: "number", value_type: "float", required: false }
          - { label: "Next reserve price applies from", name: "reserve_price_next_from", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - label: "Calendar links"
            name: "calendar_links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Auctions"
            name: "auctions"
            widget: "list"
            summary: "{{fields.date}} · {{fields.volume}} UKAs"
            hint: "Add each new year's dates when ICE publishes the calendar (usually in October). Past auctions are hidden on the site automatically."
            fields:
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Volume (UKAs)", name: "volume", widget: "number", value_type: "int" }

  - name: "weather"
    label: "Renewables Weather Outlook"
    files:
      - name: "weather-outlook"
        label: "Weekly outlooks (/weather page)"
        file: "content/weather-outlook.json"
        fields:
          - label: "Weeks"
            name: "weeks"
            widget: "list"
            add_to_top: true
            summary: "w/c {{fields.week_commencing}}"
            hint: "Newest week at the top. Click 'Add weeks' each weekend: the top entry is what /weather shows, and older weeks stay in the archive at /weather?week=YYYY-MM-DD. Publishing goes live within a minute or two, with no site rebuild."
            fields:
              - { label: "Week commencing (Monday)", name: "week_commencing", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Issued", name: "issued", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Headline", name: "headline", widget: "text", hint: "Two or three sentences." }
              - { label: "One-line summary", name: "summary", widget: "string", required: false, hint: "e.g. A windy Tuesday, a still and frosty Friday, and a less certain weekend." }
              - { label: "Last week's outlook vs what happened", name: "review", widget: "text", required: false, hint: "Optional one or two lines. The page also shows Elexon outturn for last week automatically." }
              - label: "Week at a glance (Mon-Sun)"
                name: "days"
                widget: "list"
                summary: "{{fields.day}}: offshore {{fields.offshore}}, onshore {{fields.onshore}}, solar {{fields.solar}}"
                fields:
                  - { label: "Day", name: "day", widget: "string", hint: "e.g. Mon 16" }
                  - { label: "Offshore wind", name: "offshore", widget: "select", options: ["Strong", "Moderate", "Low", "Unclear"] }
                  - { label: "Offshore detail", name: "offshore_note", widget: "string", required: false, hint: "e.g. Lowestoft 8-18 mph, gusts 43" }
                  - { label: "Onshore wind", name: "onshore", widget: "select", options: ["Strong", "Moderate", "Low", "Unclear"] }
                  - { label: "Onshore detail", name: "onshore_note", widget: "string", required: false }
                  - { label: "Solar", name: "solar", widget: "select", options: ["Good", "Strong", "Moderate", "Low", "Unclear"] }
                  - { label: "Solar detail", name: "solar_note", widget: "string", required: false }
                  - { label: "Temperature (max / min)", name: "temperature", widget: "string", required: false, hint: "e.g. 6-9°C / 2-6°C" }
                  - { label: "Outlook", name: "outlook", widget: "string", required: false }
              - { label: "Table note (method and caveats)", name: "table_note", widget: "text", required: false }
              - label: "What this means for buyers"
                name: "buyers"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string", hint: "e.g. Low-wind risk" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Key generation areas (shown collapsed)"
                name: "areas"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Area", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "What to watch"
                name: "watch"
                widget: "list"
                required: false
                summary: "{{fields.when}}"
                fields:
                  - { label: "When", name: "when", widget: "string", hint: "e.g. Fri 20 Nov" }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Sources (kept for the record, not shown on the page)"
                name: "sources"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
              - { label: "Data notes (kept for the record, not shown on the page)", name: "caveats", widget: "text", required: false }
              - { label: "Substack post link", name: "substack_url", widget: "string", required: false, hint: "Optional. Link to this week's Substack note or email, if there is one." }
