<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .bg { fill: #0b0d0f; }
      .rule { stroke: #f2f0e9; stroke-width: 7; stroke-linecap: round; }
      .margin { stroke: #4a4d50; stroke-width: 2; stroke-linecap: round; }
      .tick { stroke: #c98a2c; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dot { fill: #c98a2c; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="120" height="120" rx="24"/>

  <!-- ledger margin rule -->
  <line class="margin" x1="21" y1="30" x2="21" y2="90"/>

  <!-- ruled entries, shortening down the page -->
  <line class="rule" x1="34" y1="44" x2="80" y2="44"/>
  <line class="rule" x1="34" y1="62" x2="92" y2="62"/>
  <line class="rule" x1="34" y1="80" x2="66" y2="80"/>

  <!-- rising market tick off the top entry -->
  <polyline class="tick" points="80,44 96,27 103,32"/>
  <circle class="dot" cx="103" cy="32" r="4.5"/>
</svg>
